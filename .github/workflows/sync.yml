name: Sync

# Once a week, every entry's latest release is checked with Kite's latest
# release. The job fails when one no longer passes, or when a new release
# means the list is out of date; either way, running make sync and
# committing what it writes settles it.
on:
  schedule:
    - cron: "41 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum

      - name: Install Kite's latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/kite"
          gh release download --repo kite-plus/kite --dir "$dir" \
            --pattern 'kite_*_linux_amd64.tar.gz' --pattern checksums.txt
          cd "$dir"
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf kite_*_linux_amd64.tar.gz kite
          echo "$dir" >> "$GITHUB_PATH"

      - name: Check every entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: make sync

      - name: Make sure the list is up to date
        run: |
          if ! git diff --exit-code; then
            echo "::error::The list is out of date: run make sync and commit what it writes."
            exit 1
          fi
