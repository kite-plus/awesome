# What an entry can be filed under, named in English and in Chinese, in the
# order the READMEs list them. A pull request can add a category along with
# the first theme or plugin that needs it.
themes:
  - {id: blog, en: Blog, zh-CN: 博客}
  - {id: docs, en: Documentation, zh-CN: 文档}

plugins:
  - {id: comments, en: Comments, zh-CN: 评论}
  - {id: analytics, en: Analytics, zh-CN: 统计}
  - {id: search, en: Search, zh-CN: 搜索}
  - {id: writing, en: Writing, zh-CN: 写作}
